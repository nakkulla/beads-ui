# 이 레포의 worker verify·deploy 선언 — 스키마와 동기화 절차는 dotfiles
# repo-onboarding 스킬이 소유한다.
#
# 이 파일이 verify·deploy 선언의 단일 SoT이자 실행 표면이다. workflow 계약의
# spec 게이트 post-merge continuity 판정도 이 [deploy] 선언을 읽는다 — 루트
# deploy.json 존재 여부가 아니다(이 레포에는 그 파일이 없고, 읽는 코드도 없다).
#
# 워커는 이 선언을 워킹트리가 아니라 **핀된 base SHA의 git blob**에서 읽는다
# (UI-kfl4, server/worker/repo-ops.js). 머지 전 해석은 fetch된 원격
# target-base tip, 머지 후 해석은 base_sync가 확정한 SHA를 핀으로 쓴다 — 그래서
# PR이 자기 브랜치에서 cmd를 바꿔도 그 PR을 검증하는 명령에는 반영되지 않는다.
#
# ~/.config/bdui/config.toml의 [worker.verify."<repo abs path>"] ·
# [worker.deploy."<repo abs path>"]는 이제 **레거시 폴백**이다: 이 파일에 해당
# 섹션이 없을 때만 쓰이고, 두 값이 다르면 이 선언이 이기며 워커 로그에 드리프트
# 경고가 남는다. 섹션이 있으나 해석 불가면 폴백으로 넘어가지 않고 fail-closed다.
# 대조는 dotfiles install.sh shell의 warn-only 체커
# (scripts/repo_ops_check.py). config.toml 항목의 실제 제거는 운영자 수동
# 정리다.

[verify]
cmd = ["npm", "run", "all"]
timeout_ms = 600000

[deploy]
adapter = "managed"
cmd = ["scripts/managed-self-deploy.js"]
timeout_ms = 600000

env_notes = "핀된 candidate release의 managed Adapter가 install·pointer cutover·restart handoff·runtime readback을 durable attempt에 결합한다"
