# 이 레포의 verify·external deploy 선언 — 스키마와 동기화 절차는 dotfiles
# repo-onboarding 스킬이 소유한다.
#
# 이 파일이 verify·deploy 선언의 단일 SoT이자 실행 표면이다. workflow 계약의
# spec 게이트 post-merge continuity 판정도 이 [deploy] 선언을 읽는다 — 루트
# deploy.json 존재 여부가 아니다(이 레포에는 그 파일이 없고, 읽는 코드도 없다).
#
# 워커의 verify 표시는 이 선언을 워킹트리가 아니라 **핀된 base SHA의 git blob**에서
# 읽는다 (UI-kfl4, server/worker/repo-ops.js). 머지 전 해석은 fetch된 원격
# target-base tip, 머지 후 해석은 base_sync가 확정한 SHA를 핀으로 쓴다. [deploy]는
# 외부 deployment provider가 exact candidate에서 읽고 실행하며 Worker는 실행하지 않는다.
#
# ~/.config/bdui/config.toml의 [worker.verify."<repo abs path>"]만 verify 선언이
# 없을 때 레거시 폴백으로 남는다. [worker.deploy]는 active 경로가 아니며 [deploy]
# 선언이 해석 불가하면 fail-closed다. 대조는 dotfiles의 warn-only checker가 맡는다.

[verify]
cmd = ["npm", "run", "all"]
timeout_ms = 600000

[deploy]
cmd = ["scripts/deploy-self.js"]
timeout_ms = 600000
