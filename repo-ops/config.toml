# 이 레포의 repo operation 선언 — 계약은 dotfiles의 workflow/repo-ops 스킬이
# 소유한다. Worker는 이 파일을 워킹트리가 아니라 **핀된 base SHA의 git blob**에서
# 읽으므로, PR이 자기 자신을 검증·배포하는 명령을 정의할 수 없다.
#
# `[verify]`는 두지 않는다. 이 레포의 merge 자격은 fresh PR/base/head identity,
# clean mergeability, current workflow review 영수증으로 판정한다.
#
# 배포는 Worker가 소유한 영구 detached 워크트리 `.worktrees/.repo-ops-deploy`에서
# 아래 script를 한 번 실행하는 것이 전부다. 그 워크트리가 안정 런타임 소스이며,
# candidate release 디렉터리와 `current` release symlink는 만들지 않는다.

base = "main"

[deploy]
script = "repo-ops/script/deploy"
timeout_ms = 600000
